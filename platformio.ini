[platformio]
default_envs = esp32dev

; The real firmware, built by `pio run` and run in Wokwi.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BMP085 Unified@^1.1.3
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit MPU6050@^2.2.6

; Unit tests for the hardware-free logic in lib/downhole_core, run on your PC
; with `pio test -e native`. No ESP32 or simulator needed.
[env:native]
platform = native
test_framework = unity
